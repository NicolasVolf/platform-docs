site_name: Nicolas — Platform 2026.2
site_description: Documentação individual de Nicolas na disciplina Plataformas, Microsserviços, DevOps e APIs (Insper, 2026.2)
site_author: Nicolas Volf Martins da Silva
site_url: https://nicolasvolf.github.io/platform-docs/
repo_url: https://github.com/NicolasVolf/platform-docs
repo_name: NicolasVolf/platform-docs

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      toggle:
        icon: material/toggle-switch-off-outline
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      toggle:
        icon: material/toggle-switch
        name: Modo claro
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.instant
    - navigation.top
    - navigation.sections
    - navigation.indexes

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      url_download: true
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Início: index.md
  - Projeto:
      - projeto/index.md
      - Account: projeto/account.md
      - Auth: projeto/auth.md
      - AWS: projeto/aws.md
      - EKS: projeto/eks.md
  - Meus bottlenecks: bottlenecks.md
  - Hands-on e exercícios: atividades.md
  - Apresentação: apresentacao.md
  - Uso de IA: uso-de-ia.md
